<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Breaker SFX test</title>
<style>
  :root { --bg: #14110f; --card: #201b18; --ink: #f3ece6; --dim: #a89b90; --acc: #fb923c; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 18px; color: var(--dim); }
  .row { background: var(--card); border-radius: 10px; padding: 12px 14px; margin-bottom: 10px; }
  .row b { color: var(--acc); }
  .row small { color: var(--dim); display: block; margin: 2px 0 8px; }
  .takes { display: flex; flex-wrap: wrap; gap: 8px; }
  button { background: #2c2521; color: var(--ink); border: 1px solid #3b322c; border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 600; }
  button:hover { border-color: var(--acc); }
  button.on { background: var(--acc); color: #1b0f06; }
</style>
</head>
<body>
<h1>Breaker SFX test</h1>
<p>Click a take to play it. Note the ones you like (e.g. "q_spin_lunge v3") and I'll wire those in.</p>
<div id="list"></div>
<script>
  const MOVES = [
    ['basic_1_swing', 'Auto attack, hit 1'], ['basic_2_swing', 'Auto attack, hit 2'], ['basic_3_swing', 'Auto attack, hit 3'],
    ['basic_4_finisher', 'Auto attack finisher'], ['hit_impact', 'Any hit landing'], ['q_spin_lunge', '[Q] Spin Lunge'],
    ['w_leap', '[W] Earthbreaker jump'], ['w_rupture', '[W] Earthbreaker landing'], ['e_guard', '[E] Bulwark guard'],
    ['e_parry', '[E] Successful parry'], ['r_charge', '[R] Holding the charge'], ['r_release', '[R] Crescent wave'],
    ['r_perfect', '[R] Perfect release'], ['a_tackle', '[A] Iron Tackle'], ['s_drag', '[S] Bedrock Drag'],
    ['s_uppercut', '[S] Heavenward Uppercut'], ['d_counter_slash', '[D] Counter X-cut'], ['d_counter_success', '[D] Counter landed'],
    ['f_titans_wrath', "[F] Titan's Wrath"], ['t_omnislash_flurry', '[T] Omnislash slashes'], ['t_omnislash_finale', '[T] Omnislash finish'],
    ['z_overpower', '[Z] Overpower Surge'], ['space_dash', '[Space] Dash']
  ];
  const list = document.getElementById('list');
  let cur = null, curBtn = null;
  for (const [file, label] of MOVES) {
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<b>${label}</b><small>${file}</small><div class="takes"></div>`;
    const takes = row.querySelector('.takes');
    for (let v = 1; v <= 4; v++) {
      const b = document.createElement('button'); b.textContent = 'v' + v;
      b.onclick = () => {
        if (cur) { cur.pause(); curBtn.classList.remove('on'); }
        cur = new Audio(`${file}_v${v}.ogg`); curBtn = b; b.classList.add('on');
        cur.onended = () => b.classList.remove('on');
        cur.play();
      };
      takes.appendChild(b);
    }
    list.appendChild(row);
  }
</script>
</body>
</html>
